default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python3 -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: python3 -m ruff format --check
        language: system
        types: [python]
      - id: mypy-core
        name: Mypy core contracts and orchestration
        entry: python3 -m mypy
        language: system
        pass_filenames: false
