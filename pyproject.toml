[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-agent-shift-benchmark"
version = "0.3.0"
description = "Synthetic benchmark for tool-using agent safety under tool, observation, memory, and constraint shift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tool-Agent Shift Benchmark Contributors"}]
dependencies = ["pyyaml>=6.0", "matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
tasb = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
