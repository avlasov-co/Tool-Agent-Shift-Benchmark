[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-agent-shift-benchmark"
version = "0.3.0"
description = "Synthetic benchmark for tool-using agent safety under tool, observation, memory, and constraint shift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tool-Agent Shift Benchmark Contributors"}]
dependencies = ["pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=7.4",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = [
  "src/tool_agent_shift_benchmark/core/contracts.py",
  "src/tool_agent_shift_benchmark/core/orchestration.py",
]
python_version = "3.10"
follow_imports = "skip"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["tool_agent_shift_benchmark"]

[tool.coverage.report]
fail_under = 73
precision = 2
show_missing = true

[project.scripts]
tasb = "tool_agent_shift_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tool_agent_shift_benchmark*"]
