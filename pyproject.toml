[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-agent-shift-benchmark"
dynamic = ["version"]
description = "Synthetic benchmark for tool-using agent safety under tool, observation, memory, and constraint shift."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Tool-Agent Shift Benchmark Contributors"}]
keywords = ["agents", "benchmark", "evaluation", "safety", "synthetic", "tool-use"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/avlasov-co/tool-agent-shift-benchmark"
Repository = "https://github.com/avlasov-co/tool-agent-shift-benchmark"
Issues = "https://github.com/avlasov-co/tool-agent-shift-benchmark/issues"
Changelog = "https://github.com/avlasov-co/tool-agent-shift-benchmark/blob/main/CHANGELOG.md"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4"]
dev = [
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "mypy>=1.13,<3",
  "pre-commit>=4.0,<5",
  "pytest>=7.4,<10",
  "ruff>=0.8,<1",
]
docs = ["mdformat>=1.0,<2"]
release = [
  "build>=1.2,<2",
  "cyclonedx-bom>=7.0,<8",
  "pip-audit>=2.0,<3",
  "twine>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = [
  "src/tool_agent_shift_benchmark/core/contracts.py",
  "src/tool_agent_shift_benchmark/core/orchestration.py",
]
python_version = "3.10"
follow_imports = "skip"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["tool_agent_shift_benchmark"]

[tool.coverage.report]
fail_under = 73
precision = 2
show_missing = true

[project.scripts]
tasb = "tool_agent_shift_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tool_agent_shift_benchmark*"]

[tool.setuptools.dynamic]
version = {attr = "tool_agent_shift_benchmark._version.__version__"}

[tool.setuptools.package-data]
tool_agent_shift_benchmark = [
  "resources/configs/*.yaml",
  "resources/policies/*.json",
  "resources/suites/*.json",
  "resources/templates/*.html",
]
