name: release artifact validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/development.txt
      - name: Build, inspect, and checksum release artifacts
        run: |
          set -euo pipefail
          make setup PYTHON=python
          python scripts/build_release_artifacts.py --output-dir release-artifacts --python python
          (cd release-artifacts && sha256sum -c SHA256SUMS)
      - name: Upload validated release artifacts without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
